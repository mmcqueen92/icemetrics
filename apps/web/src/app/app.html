<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="IceMetrics home">
      <span class="brand-mark" aria-hidden="true">IM</span>
      <span>{{ title }}</span>
    </a>

    <nav aria-label="Primary navigation">
      @for (item of navigation; track item.path) {
      <a
        mat-button
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
      >
        {{ item.label }}
      </a>
      }
    </nav>

    <app-freshness-indicator
      label="Stored data"
      detail="Freshness is reported in each explorer"
    />
  </div>
</header>

@if (navigationProgress.loading()) {
<mat-progress-bar
  class="route-progress"
  mode="indeterminate"
  aria-label="Loading page"
/>
}

<app-global-error-notification />

<main #mainContent id="main-content" class="page-shell" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <p>Independent NHL analytics. No league or team affiliation.</p>
  <a routerLink="/about">About IceMetrics</a>
</footer>
