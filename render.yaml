previews:
  generation: off

projects:
  - name: icemetrics
    environments:
      - name: staging
        networking:
          isolation: enabled
        permissions:
          protection: disabled
        databases:
          - name: icemetrics-staging-db
            databaseName: icemetrics_staging
            ipAllowList: []
            postgresMajorVersion: '17'
            region: oregon
            storageAutoscalingEnabled: true
            user: icemetrics_staging
        services:
          - type: web
            runtime: static
            name: icemetrics-staging-web
            autoDeployTrigger: off
            buildCommand: npm ci --no-audit && npm run build:deploy --workspace @icemetrics/web
            staticPublishPath: apps/web/dist/web/browser
            envVars:
              - key: APP_ENV
                value: staging
              - key: PUBLIC_API_BASE_URL
                value: https://icemetrics-staging-api.onrender.com/api/v1
              - key: PUBLIC_SENTRY_DSN
                sync: false
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://icemetrics-staging-api.onrender.com https://*.ingest.sentry.io; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /media/*
                name: Cache-Control
                value: public, max-age=31536000, immutable
          - type: web
            runtime: docker
            name: icemetrics-staging-api
            autoDeployTrigger: off
            dockerfilePath: ./Dockerfile.api
            dockerCommand: node apps/api/dist/main.js
            healthCheckPath: /health/ready
            preDeployCommand: npm run db:migrate:deploy --workspace @icemetrics/api
            region: oregon
            envVars:
              - key: NODE_ENV
                value: production
              - key: APP_ENV
                value: staging
              - key: DATABASE_URL
                fromDatabase:
                  name: icemetrics-staging-db
                  property: connectionString
              - key: LOG_LEVEL
                value: info
              - key: CORS_ALLOWED_ORIGINS
                value: https://icemetrics-staging-web.onrender.com
              - key: PUBLIC_API_BASE_URL
                value: https://icemetrics-staging-api.onrender.com/api/v1
              - key: SENTRY_DSN
                sync: false
              - key: SENTRY_ENVIRONMENT
                value: staging
          - type: cron
            runtime: docker
            name: icemetrics-staging-jobs
            autoDeployTrigger: off
            dockerfilePath: ./Dockerfile.api
            dockerCommand: node apps/api/dist/job-runner.js dispatch && node apps/api/dist/job-runner.js health
            region: oregon
            schedule: '0 * * * *'
            envVars:
              - key: NODE_ENV
                value: production
              - key: APP_ENV
                value: staging
              - key: DATABASE_URL
                fromDatabase:
                  name: icemetrics-staging-db
                  property: connectionString
              - key: LOG_LEVEL
                value: info
              - key: CORS_ALLOWED_ORIGINS
                value: https://icemetrics-staging-web.onrender.com
              - key: PUBLIC_API_BASE_URL
                value: https://icemetrics-staging-api.onrender.com/api/v1
              - key: SENTRY_DSN
                sync: false
              - key: SENTRY_ENVIRONMENT
                value: staging
      - name: production
        networking:
          isolation: enabled
        permissions:
          protection: enabled
        databases:
          - name: icemetrics-production-db
            databaseName: icemetrics_production
            ipAllowList: []
            postgresMajorVersion: '17'
            region: oregon
            storageAutoscalingEnabled: true
            user: icemetrics_production
        services:
          - type: web
            runtime: static
            name: icemetrics-production-web
            autoDeployTrigger: off
            buildCommand: npm ci --no-audit && npm run build:deploy --workspace @icemetrics/web
            staticPublishPath: apps/web/dist/web/browser
            envVars:
              - key: APP_ENV
                value: production
              - key: PUBLIC_API_BASE_URL
                value: https://icemetrics-production-api.onrender.com/api/v1
              - key: PUBLIC_SENTRY_DSN
                sync: false
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://icemetrics-production-api.onrender.com https://*.ingest.sentry.io; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /media/*
                name: Cache-Control
                value: public, max-age=31536000, immutable
          - type: web
            runtime: docker
            name: icemetrics-production-api
            autoDeployTrigger: off
            dockerfilePath: ./Dockerfile.api
            dockerCommand: node apps/api/dist/main.js
            healthCheckPath: /health/ready
            preDeployCommand: npm run db:migrate:deploy --workspace @icemetrics/api
            region: oregon
            envVars:
              - key: NODE_ENV
                value: production
              - key: APP_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: icemetrics-production-db
                  property: connectionString
              - key: LOG_LEVEL
                value: info
              - key: CORS_ALLOWED_ORIGINS
                value: https://icemetrics-production-web.onrender.com
              - key: PUBLIC_API_BASE_URL
                value: https://icemetrics-production-api.onrender.com/api/v1
              - key: SENTRY_DSN
                sync: false
              - key: SENTRY_ENVIRONMENT
                value: production
          - type: cron
            runtime: docker
            name: icemetrics-production-jobs
            autoDeployTrigger: off
            dockerfilePath: ./Dockerfile.api
            dockerCommand: node apps/api/dist/job-runner.js dispatch && node apps/api/dist/job-runner.js health
            region: oregon
            schedule: '0 * * * *'
            envVars:
              - key: NODE_ENV
                value: production
              - key: APP_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: icemetrics-production-db
                  property: connectionString
              - key: LOG_LEVEL
                value: info
              - key: CORS_ALLOWED_ORIGINS
                value: https://icemetrics-production-web.onrender.com
              - key: PUBLIC_API_BASE_URL
                value: https://icemetrics-production-api.onrender.com/api/v1
              - key: SENTRY_DSN
                sync: false
              - key: SENTRY_ENVIRONMENT
                value: production
